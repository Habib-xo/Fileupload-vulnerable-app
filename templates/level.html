<!DOCTYPE html>
<html>
<head>
    <title>Level {{ level }}</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="card">
        {% if success %}
            <h3 style="color: #2e7d32;">✅ Level {{ level }} Bypassed!</h3>
            <p style="margin: 15px 0;">File saved: <code>/uploads/{{ filename }}</code></p>
            <a href="/uploads/{{ filename }}">View File</a> | <a href="/level{{ level }}">Back</a>
        {% elif error %}
            <h3 style="color: #c62828;">Error</h3>
            <p style="margin: 10px 0;">{{ error }}</p>
            <br><a href="/level{{ level }}">Try Again</a>
        {% else %}
            <h2>{{ title }}</h2>
            <span class="badge">{{ protection }}</span>
            <form action="{{ action_url }}" method="post" enctype="multipart/form-data">
                <input type="file" name="file" required>
                <input type="submit" value="Upload File">
            </form>
            <br><a href="/" style="font-size: 0.85rem;">← Main Menu</a>
        {% endif %}
    </div>
</body>
</html>
